# XcodeGen project definition. Re-run `xcodegen generate` after editing.
# Contract: this file is the single source of truth for project structure
# and build settings. Do NOT hand-edit GoodRecording.xcodeproj.

name: GoodRecording

options:
  bundleIdPrefix: com.zzming
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    # All test targets need this — they don't ship their own Info.plist.
    GENERATE_INFOPLIST_FILE: YES
  configs:
    # Debug builds use a self-signed local cert which has no Apple Team
    # Identifier. Two Xcode-16-era escape hatches needed:
    #   1. ENABLE_HARDENED_RUNTIME = NO — dyld under Hardened Runtime
    #      treats team_id="not set" on both main binary and companion
    #      dylib as a mismatch, refusing to load.
    #   2. ENABLE_DEBUG_DYLIB = NO — Xcode 16 by default splits the
    #      Swift portion into a separate .debug.dylib for faster
    #      incremental builds. That dylib has its own (cdhash-only)
    #      identity and breaks under self-signed identities. Disabling
    #      it makes Xcode produce the traditional monolithic binary,
    #      eliminating the dyld load problem entirely.
    # Release builds (Apple Developer ID signed for distribution) keep
    # both YES per Constitution IV.
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
      ENABLE_DEBUG_DYLIB: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES
      ENABLE_DEBUG_DYLIB: NO

targets:
  GoodRecording:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Features
      - path: Sources/Core
      # XcodeGen has no separate `resources:` field — assets and string
      # catalogs go in `sources:` and are auto-detected by extension.
      # (Earlier we put these under `resources:` and XcodeGen silently
      # ignored them, so the .app was being built without Resources/ at
      # all → no app icon, no localization, no entitlements processing.)
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        # IMPORTANT: We intentionally do NOT use XcodeGen's `info:` and
        # `entitlements:` keys, because those make XcodeGen overwrite the
        # files on every `xcodegen generate` (silently dropping our 6-key
        # entitlement set and the 三要素 NSUsageDescription strings).
        # Instead we point Xcode at the files via build settings; XcodeGen
        # then only references them.
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/GoodRecording.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LSApplicationCategoryType: public.app-category.video
        ENABLE_APP_SANDBOX: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zzming.good-recording
        # Local dev signing identity (created by scripts/make-local-cert.sh).
        # Stable across rebuilds, so macOS TCC keeps the user's Screen
        # Recording / Microphone grants valid. To use Apple Developer ID
        # instead, override these on the xcodebuild command line.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "GoodRecording Local Dev"
        # We don't want INFOPLIST_FILE here AND a generated one — disable
        # auto-generation explicitly for the app target.
        GENERATE_INFOPLIST_FILE: NO

  UnitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: GoodRecording

  IntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IntegrationTests
    dependencies:
      - target: GoodRecording

  UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: GoodRecording

schemes:
  GoodRecording:
    build:
      targets:
        GoodRecording: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UnitTests
        - IntegrationTests
        - UITests
    archive:
      config: Release
