# XcodeGen project definition. Re-run `xcodegen generate` after editing.
# Contract: this file is the single source of truth for project structure
# and build settings. Do NOT hand-edit GoodRecording.xcodeproj.

name: GoodRecording

options:
  bundleIdPrefix: com.zzming
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.zzming.good-recording
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local dev signing identity (created by scripts/make-local-cert.sh).
    # Stable across rebuilds, so macOS TCC keeps the user's Screen
    # Recording / Microphone grants valid. To use Apple Developer ID
    # instead, override these on the xcodebuild command line.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "GoodRecording Local Dev"
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  GoodRecording:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Features
      - path: Sources/Core
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        # IMPORTANT: We intentionally do NOT use XcodeGen's `info:` and
        # `entitlements:` keys, because those make XcodeGen overwrite the
        # files on every `xcodegen generate` (silently dropping our 6-key
        # entitlement set and the 三要素 NSUsageDescription strings).
        # Instead we point Xcode at the files via build settings; XcodeGen
        # then only references them.
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/GoodRecording.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LSApplicationCategoryType: public.app-category.video
        # Run xc-dependency-lint.sh as a Run Script Phase before compilation
        # (T012). Configure manually in Xcode if XcodeGen build phase format
        # changes between releases.

  UnitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: GoodRecording

  IntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IntegrationTests
    dependencies:
      - target: GoodRecording

  UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: GoodRecording

schemes:
  GoodRecording:
    build:
      targets:
        GoodRecording: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UnitTests
        - IntegrationTests
        - UITests
    archive:
      config: Release
